<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>kharchaa. · Chandan &amp; Sachin</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 15% 15%,#ded6ff,transparent 40%),linear-gradient(135deg,#f2f3ff,#eff9f7);font-family:system-ui,-apple-system,sans-serif;color:#243653;text-align:center;padding:24px}
    .card{max-width:510px;background:white;padding:42px 30px;border-radius:24px;box-shadow:0 25px 70px #463b7e20;border:1px solid #e9e8f8}
    h1{font-size:32px;margin:0 0 10px}h1 span{color:#7062e9}p{font-size:14px;color:#75839a;line-height:1.8}
    a{display:inline-block;margin-top:20px;background:#6d63e4;color:white;text-decoration:none;border-radius:12px;padding:14px 26px;font-weight:750}
    .lock{font-size:42px}
  </style>
</head>
<body>
  <div class="card"><div class="lock">🔐</div><h1>kharchaa<span>.</span></h1><p>Chandan & Sachin का private expense tracker। Group दोनों का, Personal अपना-अपना।</p><p id="status">App खोलने के लिए नीचे क्लिक करें।</p><a id="openApp" href="#" rel="noopener">अपना डैशबोर्ड खोलें ↗</a></div>
  <script>
    // Replace this with YOUR Google Apps Script Web App /exec URL.
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwoSgB7tdWm0oIl-XIjZFweU92JmRkQHuise6hcSpJzxsdrlJUsQUbjHNDGzGEXkAA/exec';
    const valid = /^https:\/\/script\.google\.com\/macros\/s\/[^\s'"<>]+\/exec(?:\?.*)?$/.test(APPS_SCRIPT_URL);
    const link = document.getElementById('openApp');
    const status = document.getElementById('status');
    if (valid) {
      link.href = APPS_SCRIPT_URL;
      status.textContent = 'सुरक्षित लॉगिन पेज खोलें।';
      // Intentionally navigate to the Apps Script hosted UI. Unlike an API call
      // from GitHub Pages, google.script.run works reliably within that page.
    } else {
      status.textContent = 'पहले इस index.html में APPS_SCRIPT_URL डालें।';
      link.style.display = 'none';
    }
  </script>
</body>
</html>
